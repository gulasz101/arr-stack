# Services configuration
# href: user-facing URL (what opens in browser when clicked)
# widget url: internal container-to-container URL for live stats
---
- Media Management:
    - Sonarr:
        icon: sonarr.png
        href: http://sonarr.arr-box.local
        description: TV Series
        widget:
          type: sonarr
          url: http://gluetun:8989
          key: {{HOMEPAGE_VAR_SONARR_API_KEY}}

    - Radarr:
        icon: radarr.png
        href: http://radarr.arr-box.local
        description: Movies
        widget:
          type: radarr
          url: http://gluetun:7878
          key: {{HOMEPAGE_VAR_RADARR_API_KEY}}

    - Prowlarr:
        icon: prowlarr.png
        href: http://prowlarr.arr-box.local
        description: Indexer Manager
        widget:
          type: prowlarr
          url: http://gluetun:9696
          key: {{HOMEPAGE_VAR_PROWLARR_API_KEY}}

- Downloads:
    - qBittorrent:
        icon: qbittorrent.png
        href: http://qbit.arr-box.local
        description: Torrent Client
        widget:
          type: qbittorrent
          url: http://gluetun:8080
          username: admin
          password: {{HOMEPAGE_VAR_QBITTORRENT_PASSWORD}}

    - Bazarr:
        icon: bazarr.png
        href: http://bazarr.arr-box.local
        description: Subtitles
        widget:
          type: bazarr
          url: http://bazarr:6767
          key: {{HOMEPAGE_VAR_BAZARR_API_KEY}}

- Streaming:
    - Jellyfin:
        icon: jellyfin.png
        href: http://jellyfin.arr-box.local
        description: Media Server
        widget:
          type: jellyfin
          url: http://jellyfin:8096
          key: {{HOMEPAGE_VAR_JELLYFIN_API_KEY}}
          enableBlocks: true
