# ===========================================
# 🏴‍☠️ Arr Stack - Home Media Server
# ===========================================
# Access via Caddy reverse proxy:
#   Local:   http://arr-box.local           (Dashboard)
#   NetBird: http://arr-box.netbird.cloud   (Dashboard)
#   Subdomain examples:
#     http://jellyfin.arr-box.local
#     http://jellyfin.arr-box.netbird.cloud
# ===========================================

services:
  # ===========================================
  # Caddy - Reverse Proxy
  # ===========================================
  caddy:
    image: caddy:2.11-alpine
    container_name: caddy
    ports:
      - "80:80"
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./config/caddy/data:/data
      - ./config/caddy/config:/config
    environment:
      - TZ=${TZ:-Europe/Berlin}
    restart: unless-stopped

  # ===========================================
  # GLUETUN - VPN Container (Mullvad WireGuard)
  # ===========================================
  gluetun:
    image: qmcgaw/gluetun:v3.41.1
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - 8080:8080   # qBittorrent WebUI
      - 6881:6881   # qBittorrent torrent port
      - 6881:6881/udp
      - 9696:9696   # Prowlarr
      - 8989:8989   # Sonarr
      - 7878:7878   # Radarr
      - 8191:8191   # FlareSolverr
    environment:
      - VPN_SERVICE_PROVIDER=mullvad
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${MULLVAD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${MULLVAD_ADDRESS}
      - SERVER_COUNTRIES=${VPN_COUNTRY:-Spain}
      - FIREWALL_OUTBOUND_SUBNETS=${LAN_SUBNET:-192.168.1.0/24}
      - PUID=${PUID:-1100}
      - PGID=${PGID:-1100}
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      - ./config/gluetun:/gluetun
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================
  # qBittorrent
  # ===========================================
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.2.3_v2.0.13-ls467
    container_name: qbittorrent
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID:-1100}
      - PGID=${PGID:-1100}
      - TZ=${TZ:-Europe/Berlin}
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
    volumes:
      - ./config/qbittorrent:/config
      - ${DOWNLOAD_PATH:-/mnt/downloads}:/downloads
    restart: unless-stopped

  # ===========================================
  # Prowlarr - Indexer manager
  # ===========================================
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.4.0.5397-ls153
    container_name: prowlarr
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID:-1100}
      - PGID=${PGID:-1100}
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      - ./config/prowlarr:/config
    restart: unless-stopped

  # ===========================================
  # Sonarr - TV Series
  # ===========================================
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.19.2979-ls319
    container_name: sonarr
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID:-1100}
      - PGID=${PGID:-1100}
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      - ./config/sonarr:/config
      - ${DOWNLOAD_PATH:-/mnt/downloads}:/downloads
      - ${MEDIA_PATH:-/mnt/media}/tv:/tv
    restart: unless-stopped

  # ===========================================
  # Radarr - Movies
  # ===========================================
  radarr:
    image: lscr.io/linuxserver/radarr:6.2.1.10461-ls309
    container_name: radarr
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID:-1100}
      - PGID=${PGID:-1100}
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      - ./config/radarr:/config
      - ${DOWNLOAD_PATH:-/mnt/downloads}:/downloads
      - ${MEDIA_PATH:-/mnt/media}/movies:/movies
    restart: unless-stopped

  # ===========================================
  # Bazarr - Subtitles
  # ===========================================
  bazarr:
    image: lscr.io/linuxserver/bazarr:v1.6.0-ls354
    container_name: bazarr
    ports:
      - 6767:6767
    environment:
      - PUID=${PUID:-1100}
      - PGID=${PGID:-1100}
      - TZ=${TZ:-Europe/Berlin}
    volumes:
      - ./config/bazarr:/config
      - ${MEDIA_PATH:-/mnt/media}/tv:/tv
      - ${MEDIA_PATH:-/mnt/media}/movies:/movies
    depends_on:
      - sonarr
      - radarr
    restart: unless-stopped

  # ===========================================
  # Homepage - Dashboard
  # ===========================================
  homepage:
    image: ghcr.io/gethomepage/homepage:v1.13.2
    container_name: homepage
    ports:
      - 3000:3000
    environment:
      - PUID=${PUID:-1100}
      - PGID=${PGID:-1100}
      - HOMEPAGE_ALLOWED_HOSTS=${ARR_HOSTNAME_LOCAL:-arr-box.local},${ARR_HOSTNAME_NETBIRD:-arr-box.netbird.cloud},localhost
      - HOMEPAGE_VAR_SONARR_API_KEY=${SONARR_API_KEY}
      - HOMEPAGE_VAR_RADARR_API_KEY=${RADARR_API_KEY}
      - HOMEPAGE_VAR_PROWLARR_API_KEY=${PROWLARR_API_KEY}
      - HOMEPAGE_VAR_BAZARR_API_KEY=${BAZARR_API_KEY}
      - HOMEPAGE_VAR_JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
      - HOMEPAGE_VAR_QBITTORRENT_PASSWORD=${QBITTORRENT_PASSWORD}
    volumes:
      - ./config/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  # ===========================================
  # FlareSolverr - Bypass Cloudflare protection
  # ===========================================
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0
    container_name: flaresolverr
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ:-Europe/Berlin}
    restart: unless-stopped

  # ===========================================
  # Jellyfin - Media Server
  # ===========================================
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:10.11.11ubu2404-ls40
    container_name: jellyfin
    ports:
      - 8096:8096
    environment:
      - PUID=${PUID:-1100}
      - PGID=${PGID:-1100}
      - TZ=${TZ:-Europe/Berlin}
      - JELLYFIN_PublishedServerUrl=http://jellyfin.${ARR_HOSTNAME_LOCAL:-arr-box.local}
    volumes:
      - ./config/jellyfin:/config
      - ${MEDIA_PATH:-/mnt/media}/tv:/data/tvshows
      - ${MEDIA_PATH:-/mnt/media}/movies:/data/movies
    restart: unless-stopped
