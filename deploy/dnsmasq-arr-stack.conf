# arr-stack wildcard DNS — LAN listener
# Only bind to LAN interface — NetBird already holds 100.96.191.232:53
# Deploy: cp deploy/dnsmasq-arr-stack.conf /etc/dnsmasq.d/arr-stack.conf
bind-interfaces
listen-address=192.168.1.162

# Wildcard resolution
address=/.arr-box.local/192.168.1.162
address=/.arr-box.netbird.cloud/100.96.191.232

# Forward everything else to OPNsense
server=192.168.1.1
