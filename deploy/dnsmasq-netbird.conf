# arr-stack wildcard DNS — NetBird listener (port 5301)
# Second dnsmasq instance for NetBird peers.
# NetBird holds 100.96.191.232:53 so we run on port 5301.
# Deploy: cp deploy/dnsmasq-netbird.conf /etc/dnsmasq-netbird.conf
# Configure NetBird admin DNS → Nameserver: 100.96.191.232:5301 for domain arr-box.netbird.cloud
port=5301
bind-interfaces
listen-address=100.96.191.232

# Wildcard resolution
address=/.arr-box.local/192.168.1.162
address=/.arr-box.netbird.cloud/100.96.191.232

# No upstream — only serves wildcard records for arr-stack
no-resolv
