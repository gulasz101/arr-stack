# Creation rules for the sops files in this repo (GUL-784).
#
# Both age recipients are required, in every repo:
#   age195fed... the paperclip Air / homelab-2nd identity (flux-system/sops-age
#                holds the same private half), i.e. the machine that checks this
#                repo out
#   age1mt6y8... the original homelab key, rotated out of day-to-day use on
#                16 Oct 2026 but still the only key .env.sops was written for
# Any rule that names one of them creates a file the other host cannot read,
# and `sops updatekeys` REMOVES recipients the matching rule omits.
#
# This file must stay at the repo root: sops finds its config by walking up
# from the directory you run it in, nearest file wins, never down and never
# from the file it is operating on. A second .sops.yaml in a subdirectory
# silently shadows this one — that is how riff_radar lost a recipient
# (GUL-758). The gate lives in homelab-2nd and runs in any checkout:
#   bash ~/Projects/homelab-2nd/scripts/tests/sops-config-check.sh .
#
# Re-key without ever writing plaintext (needs an identity that can still read
# the file):
#   SOPS_AGE_KEY_FILE=<old identity> sops updatekeys .env.sops
creation_rules:
  # .env (plaintext, gitignored) and .env.sops (encrypted, tracked) only.
  # Deliberately not .env.example - that is a template with no secrets.
  - path_regex: (^|/)\.env(\.sops)?$
    age: "age195fednlfd8q35tvyvf7umlseu4ez37k2m2d0wjawmje6nr9kzgyquhau9s,age1mt6y86q9lhrmky0c0j7xwvacfzpep3w6e7z8zsrr22jj2u49gs6s59h7w2"
